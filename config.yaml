app:
  name: LightEDR
  version: 1.0.0
  debug: true
  host: 0.0.0.0
  port: 8000
database:
  url: sqlite:///./lightedr.db
  echo: false
collector:
  interval_seconds: 300
  enabled_collectors:
    - process
    - network
    - service
    - eventlog
    - registry
    - scheduled_tasks
detection:
  yara_rules_path: rules/yara
  sigma_rules_path: rules/sigma
  ioc_path: rules/iocs
  rules_dir: rules
logging:
  level: INFO
  file: logs/lightedr.log
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
mitre:
  attack_data_path: app/mitre/techniques.json
remote:
  enabled: true
  listen_port: 8000
  allow_origins:
    - "*"
  agents:
    - hostname: kali-attacker
      ip: 192.168.100.10
      os: Linux
      description: Kali Linux - Attack simulation
    - hostname: win11-target
      ip: 192.168.100.20
      os: Windows
      description: Windows 11 - Target with Sysmon
    - hostname: ubuntu-server
      ip: 192.168.100.30
      os: Linux
      description: Ubuntu - DFIR Framework & Dashboard
